# Project OpenOCD setup for the STM32F4VE four-wire SWD connection.
# This setup has no physical ST-LINK NRST connection, so do not advertise an
# external SRST line. With no SRST, OpenOCD uses the Cortex-M VECTRESET
# software-reset path (the default reset mode for this Cortex-M4 target).

source [find board/stm32f4discovery.cfg]

reset_config none

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
