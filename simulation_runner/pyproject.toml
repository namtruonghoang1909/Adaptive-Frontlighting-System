[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afs-simulation-runner"
version = "0.1.0"
description = "MetaDrive runner, vehicle extraction, and simulation adapter for the AFS prototype."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
afs-metadrive-runner = "metadrive_runner.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
